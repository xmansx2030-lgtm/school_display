name: Deploy production

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full, green commit from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-school-display
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SSH_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/school_reports' }}

    steps:
      - name: Validate requested release
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1

      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Require the commit to belong to main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Build and upload immutable release archive
        run: |
          short="${SOURCE_SHA:0:7}"
          archive="$RUNNER_TEMP/school-display-$short.tar.gz"
          git archive --format=tar.gz -o "$archive" "$SOURCE_SHA"
          scp -o IdentitiesOnly=yes -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            "$archive" "$SSH_TARGET:/tmp/school-display-$short-$GITHUB_RUN_ID.tar.gz"
          scp -o IdentitiesOnly=yes -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            deploy/deploy.sh "$SSH_TARGET:/tmp/school-display-deploy-$short-$GITHUB_RUN_ID.sh"

      - name: Back up, deploy, migrate, and verify
        run: |
          short="${SOURCE_SHA:0:7}"
          ssh -o IdentitiesOnly=yes -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" \
            "sudo -n install -o deploy -g deploy -m 0600 \
             '/tmp/school-display-$short-$GITHUB_RUN_ID.tar.gz' \
             '/home/deploy/releases/school-display-$short.tar.gz' && \
             sudo -n bash '/tmp/school-display-deploy-$short-$GITHUB_RUN_ID.sh' '$short' '$SOURCE_SHA'"
          curl --fail --silent --show-error --max-time 20 \
            https://school-display.com/ > /dev/null

      - name: Keep reviewed deploy script current
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" \
            "sudo -n cp /opt/school-display/app/deploy/deploy.sh /home/deploy/deploy.sh && \
             sudo -n chown deploy:deploy /home/deploy/deploy.sh && \
             sudo -n chmod 0755 /home/deploy/deploy.sh && \
             sudo -n bash -n /home/deploy/deploy.sh"

      - name: Stamp Operations Center
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" \
            "cd '$DEPLOY_PATH' && sudo -n docker compose -f compose.hetzner.yaml \
             exec -T web python manage.py stamp_managed_project_release \
             school-display '$SOURCE_SHA'"
