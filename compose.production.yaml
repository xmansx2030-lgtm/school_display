name: school-display

x-logging: &default-logging
  driver: local
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
    max-file: ${DOCKER_LOG_MAX_FILES:-5}

x-django: &django
  build:
    context: .
  restart: unless-stopped
  logging: *default-logging
  env_file:
    - ${ENV_FILE:-.env.production}
  depends_on:
    postgres:
      condition: service_healthy
    redis-cache:
      condition: service_healthy
    redis-channels:
      condition: service_healthy
  networks:
    - backend
  ulimits:
    nofile:
      soft: 65535
      hard: 65535

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${CADDY_MEMORY_LIMIT:-192m}
    env_file:
      - ${ENV_FILE:-.env.production}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static-data:/srv/static:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - frontend
      - backend
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  web:
    <<: *django
    mem_limit: ${WEB_MEMORY_LIMIT:-1024m}
    # Deliberately no --max-requests / --max-requests-jitter here.
    #
    # Worker recycling is a request-counted safety net designed for synchronous
    # HTTP workers. This is an ASGI worker that also holds every display screen's
    # WebSocket: recycling closes all of them at once, and each screen then
    # reconnects on a 5-90s backoff (see _wsReconnectDelaySec in display.js) and
    # falls back to slow polling in the meantime. Because the screens themselves
    # generate the request count, the recycle fires on a schedule set by fleet
    # size — the more screens, the more often every screen goes stale.
    #
    # Memory is bounded by mem_limit above plus `restart: unless-stopped`, which
    # is the right backstop for a process holding long-lived connections.
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.asgi:application
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --workers=$${WEB_CONCURRENCY:-2}
      --timeout=120
      --keep-alive=5
      --graceful-timeout=30
      --error-logfile=-"
    volumes:
      - static-data:/app/staticfiles
    networks:
      - frontend
      - backend

  snapshot-worker:
    <<: *django
    mem_limit: ${SNAPSHOT_WORKER_MEMORY_LIMIT:-512m}
    depends_on:
      web:
        condition: service_healthy
    command: python manage.py display_snapshot_worker --poll-timeout=5
    healthcheck:
      test: ["CMD", "python", "manage.py", "display_runtime_health", "snapshot-worker"]
      interval: 41s
      timeout: 10s
      retries: 3
      start_period: 47s

  wake-scheduler:
    <<: *django
    mem_limit: ${WAKE_SCHEDULER_MEMORY_LIMIT:-256m}
    depends_on:
      web:
        condition: service_healthy
    command: >-
      python manage.py display_wake_scheduler
      --interval=60
      --lead-minutes=30
      --window-seconds=90
    healthcheck:
      test: ["CMD", "python", "manage.py", "display_runtime_health", "wake-scheduler"]
      interval: 53s
      timeout: 10s
      retries: 3
      start_period: 59s

  telegram-alert-worker:
    <<: *django
    mem_limit: ${TELEGRAM_ALERT_WORKER_MEMORY_LIMIT:-192m}
    depends_on:
      web:
        condition: service_healthy
    command: python manage.py telegram_alert_worker
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "python", "manage.py", "telegram_alert_health"]
      interval: 61s
      timeout: 10s
      retries: 3
      start_period: 71s

  email-notification-worker:
    <<: *django
    mem_limit: ${EMAIL_NOTIFICATION_WORKER_MEMORY_LIMIT:-192m}
    depends_on:
      web:
        condition: service_healthy
    command: python manage.py email_notification_worker
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "python", "manage.py", "email_notification_worker", "--healthcheck"]
      interval: 61s
      timeout: 10s
      retries: 3
      start_period: 71s

  moyasar-reconciliation-worker:
    <<: *django
    mem_limit: ${MOYASAR_RECONCILIATION_WORKER_MEMORY_LIMIT:-192m}
    depends_on:
      web:
        condition: service_healthy
    command: python manage.py moyasar_reconciliation_worker
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "python", "manage.py", "moyasar_reconciliation_worker", "--healthcheck"]
      interval: 31s
      timeout: 10s
      retries: 3
      start_period: 41s

  screen-monitor:
    <<: *django
    mem_limit: ${SCREEN_MONITOR_MEMORY_LIMIT:-192m}
    depends_on:
      web:
        condition: service_healthy
    command: python manage.py screen_monitor_worker --interval=60
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "python", "manage.py", "screen_monitor_worker", "--healthcheck"]
      interval: 61s
      timeout: 10s
      retries: 3
      start_period: 71s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1024m}
    env_file:
      - ${ENV_FILE:-.env.production}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  redis-cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${REDIS_CACHE_MEMORY_LIMIT:-640m}
    env_file:
      - ${ENV_FILE:-.env.production}
    # No AOF here, deliberately. This instance holds nothing that must survive a
    # restart: snapshots rebuild, rate limits and dedupe keys re-arm, and its
    # own `allkeys-lru` policy already evicts entries whenever it feels like it,
    # so every reader is written to tolerate a miss. Alert throttling in
    # core/screen_monitoring.py reads the outage log rather than a cache counter
    # for exactly this reason. Sessions are in Postgres, not here.
    #
    # What it cost: every presence heartbeat from every connected screen became
    # a disk write, permanently, for data that is disposable by definition.
    # `redis-channels` keeps its AOF — that one carries undelivered messages.
    command: >-
      sh -c 'exec redis-server
      --appendonly no
      --save ""
      --maxmemory "$${REDIS_CACHE_MAXMEMORY:-512mb}"
      --maxmemory-policy allkeys-lru
      --requirepass "$${REDIS_CACHE_PASSWORD}"'
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_CACHE_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  redis-channels:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${REDIS_CHANNELS_MEMORY_LIMIT:-384m}
    env_file:
      - ${ENV_FILE:-.env.production}
    command: >-
      sh -c 'exec redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory "$${REDIS_CHANNELS_MAXMEMORY:-256mb}"
      --maxmemory-policy noeviction
      --requirepass "$${REDIS_CHANNELS_PASSWORD}"'
    volumes:
      - redis-channels-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_CHANNELS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  offsite-backup:
    image: restic/restic:0.18.1
    profiles: ["operations"]
    restart: "no"
    logging: *default-logging
    mem_limit: ${BACKUP_MEMORY_LIMIT:-384m}
    cpus: ${BACKUP_CPU_LIMIT:-0.50}
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      RESTIC_CACHE_DIR: /cache
    entrypoint: ["/bin/sh", "/scripts/offsite-backup.sh"]
    volumes:
      - ./backups:/data:ro
      - ./deploy/offsite-backup.sh:/scripts/offsite-backup.sh:ro
      - /root/.ssh/school-display-backup:/root/.ssh/id_ed25519:ro
      - /root/.ssh/school-display-backup-known_hosts:/root/.ssh/known_hosts:ro
      - ./deploy/storage-box-ssh-config:/config/ssh_config:ro
      - restic-cache:/cache

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres-data:
  redis-cache-data:
  redis-channels-data:
  static-data:
  caddy-data:
  caddy-config:
  restic-cache:
