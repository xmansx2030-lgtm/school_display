[tool.coverage.run]
branch = true
source = ["core", "dashboard", "display", "notices", "schedule", "standby", "subscriptions", "website"]
omit = ["*/migrations/*", "*/tests.py", "manage.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Raised from 20 once the billing, access-control and verification paths were
# covered. Treat this as a ratchet: raise it, never lower it.
fail_under = 40

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["*/migrations/*", "staticfiles"]

[tool.ruff.lint]
# Start with correctness rules that can catch runtime bugs without forcing a
# large formatting rewrite. Broader cleanup belongs to the refactor batch.
select = ["E9", "F63", "F7", "F82"]
