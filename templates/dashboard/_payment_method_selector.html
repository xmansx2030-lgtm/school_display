<div class="payment-method-selector" role="group" aria-label="اختر طريقة الدفع">
  <button
    type="button"
    class="payment-method-choice"
    data-payment-choice="{{ payment_scope }}"
    data-payment-method="moyasar"
    aria-pressed="false"
    {% if not moyasar_available %}disabled aria-disabled="true"{% endif %}
  >
    <span class="payment-method-logo payment-method-logo-moyasar">
      {% include "dashboard/_electronic_payment_icon.html" %}
    </span>
    <span class="min-w-0 flex-1 text-right">
      <strong class="block text-sm text-slate-900">الدفع الإلكتروني</strong>
      <small class="mt-1 block text-[10px] leading-5 text-slate-500">مدى، Visa وMastercard</small>
    </span>
    {% if moyasar_available %}
      <span class="payment-method-status is-ready">متاح</span>
    {% elif moyasar_pending_activation %}
      <span class="payment-method-status is-pending">قيد التفعيل</span>
    {% else %}
      <span class="payment-method-status">غير متاح</span>
    {% endif %}
  </button>

  <button
    type="button"
    class="payment-method-choice"
    data-payment-choice="{{ payment_scope }}"
    data-payment-method="tamara"
    aria-pressed="false"
    {% if not tamara_available %}disabled aria-disabled="true"{% endif %}
  >
    <span class="payment-method-logo payment-method-logo-tamara">t</span>
    <span class="min-w-0 flex-1 text-right">
      <strong class="block text-sm text-slate-900">تمارا</strong>
      <small class="mt-1 block text-[10px] leading-5 text-slate-500">انتقال آمن وخيارات دفع حسب الأهلية</small>
    </span>
    {% if tamara_available %}
      <span class="payment-method-status is-ready">متاح</span>
    {% else %}
      <span class="payment-method-status">غير متاح</span>
    {% endif %}
  </button>

  <button
    type="button"
    class="payment-method-choice"
    data-payment-choice="{{ payment_scope }}"
    data-payment-method="bank"
    aria-pressed="false"
  >
    <span class="payment-method-logo payment-method-logo-bank">↗</span>
    <span class="min-w-0 flex-1 text-right">
      <strong class="block text-sm text-slate-900">تحويل بنكي</strong>
      <small class="mt-1 block text-[10px] leading-5 text-slate-500">رفع الإيصال ومراجعته من الإدارة</small>
    </span>
    <span class="payment-method-status is-manual">يدوي</span>
  </button>
</div>
