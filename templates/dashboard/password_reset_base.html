{% load static %}
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>{% block title %}استعادة كلمة المرور{% endblock %} — لوحة العرض الذكية</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=20260723-logo1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800;900&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/tailwind.generated.css' %}?v=2026-07-23-login1">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; padding: 24px;
      display: grid; place-items: center; color: #1e293b;
      background: radial-gradient(circle at 90% 10%, rgba(79,70,229,.12), transparent 34%), #f1f5f9;
      font-family: 'Alexandria', 'Cairo', system-ui, sans-serif;
    }
    .auth-shell { width: min(520px, 100%); }
    .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 18px; color: #1e293b; text-decoration: none; font-weight: 900; }
    .brand-mark { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: white; background: linear-gradient(135deg, #6366f1, #7c3aed); box-shadow: 0 10px 24px rgba(79,70,229,.22); }
    .auth-card { padding: clamp(24px, 6vw, 38px); border: 1px solid rgba(255,255,255,.8); border-radius: 28px; background: rgba(255,255,255,.94); box-shadow: 0 24px 70px rgba(15,23,42,.1); }
    h1 { margin: 0 0 10px; font-size: clamp(22px, 5vw, 28px); text-align: center; }
    .lead { margin: 0 0 24px; color: #64748b; font-family: 'Cairo', sans-serif; font-size: 14px; line-height: 1.9; text-align: center; }
    label { display: block; margin: 0 4px 7px; color: #475569; font-size: 13px; font-weight: 800; }
    input { width: 100%; min-height: 52px; padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 13px; outline: 0; color: #1e293b; background: white; font: 15px 'Cairo', sans-serif; direction: ltr; text-align: left; }
    input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
    .field { margin-bottom: 17px; }
    .errors { margin: 7px 0 0; padding: 0; list-style: none; color: #dc2626; font: 12px/1.7 'Cairo', sans-serif; }
    .notice { margin: 0 0 20px; padding: 13px 15px; border: 1px solid #c7d2fe; border-radius: 14px; color: #4338ca; background: #eef2ff; font: 13px/1.9 'Cairo', sans-serif; }
    .button { width: 100%; min-height: 52px; border: 0; border-radius: 15px; cursor: pointer; color: white; background: linear-gradient(90deg, #4f46e5, #7c3aed); font: 800 14px 'Alexandria', sans-serif; box-shadow: 0 12px 25px rgba(79,70,229,.22); }
    .back { display: flex; justify-content: center; margin-top: 20px; color: #4f46e5; font-size: 13px; font-weight: 800; text-decoration: none; }
    .help { margin-top: 8px; color: #64748b; font: 12px/1.8 'Cairo', sans-serif; }
    .help ul { margin: 6px 0 0; padding-right: 18px; }
    @media (max-width: 540px) { body { padding: 14px; } .auth-card { border-radius: 22px; } }
  </style>
</head>
<body>
  <main class="auth-shell">
    <a href="/" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      </span>
      <span>لوحة العرض الذكية</span>
    </a>
    <section class="auth-card">
      {% block content %}{% endblock %}
    </section>
  </main>
</body>
</html>
