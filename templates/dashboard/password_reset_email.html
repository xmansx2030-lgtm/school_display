<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
</head>
<body style="margin:0;padding:24px;background:#f1f5f9;color:#1e293b;font-family:Arial,Tahoma,sans-serif;direction:rtl;text-align:right">
  <div style="max-width:600px;margin:0 auto;padding:32px;border-radius:20px;background:#ffffff">
    <h1 style="margin:0 0 18px;font-size:24px">استعادة كلمة المرور</h1>
    <p style="font-size:15px;line-height:1.9">تلقينا طلبًا لاستعادة كلمة المرور لحسابك في لوحة العرض الذكية.</p>
    <p style="margin:26px 0;text-align:center">
      <a href="{{ protocol }}://{{ domain }}{% url 'dashboard:password_reset_confirm' uidb64=uid token=token %}" style="display:inline-block;padding:14px 24px;border-radius:12px;background:#4f46e5;color:#ffffff;text-decoration:none;font-weight:bold">تعيين كلمة مرور جديدة</a>
    </p>
    <p style="font-size:13px;line-height:1.9;color:#64748b">تنتهي صلاحية الرابط بعد فترة محدودة، ويمكن استخدامه مرة واحدة فقط. إذا لم تطلب تغيير كلمة المرور فتجاهل هذه الرسالة.</p>
  </div>
</body>
</html>
