<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
</head>
<body style="margin:0;padding:24px;background:#f1f5f9;color:#1e293b;font-family:Arial,Tahoma,sans-serif;direction:rtl;text-align:right">
  <div style="max-width:620px;margin:0 auto;padding:32px;border-radius:20px;background:#ffffff">
    <p style="margin:0 0 8px;color:#d97706;font-size:13px;font-weight:bold">تذكير بالاشتراك</p>
    <h1 style="margin:0 0 20px;font-size:24px">اشتراك المدرسة {{ timing }}</h1>
    <p style="font-size:15px;line-height:1.9">نود تذكيرك بأن اشتراك مدرسة <strong>{{ school.name }}</strong> {{ timing }}.</p>
    <div style="margin:22px 0;padding:18px;border:1px solid #fde68a;border-radius:14px;background:#fffbeb;line-height:1.9">
      <div>الباقة: <strong>{{ plan.name }}</strong></div>
      <div>تاريخ الانتهاء: <strong>{{ subscription.ends_at|date:"Y-m-d" }}</strong></div>
    </div>
    <p style="margin:26px 0;text-align:center">
      <a href="{{ subscription_url }}" style="display:inline-block;padding:14px 24px;border-radius:12px;background:#4f46e5;color:#ffffff;text-decoration:none;font-weight:bold">مراجعة وتجديد الاشتراك</a>
    </p>
    <p style="font-size:13px;line-height:1.9;color:#64748b">إذا كنت قد أرسلت طلب التجديد مؤخرًا، يمكنك تجاهل هذه الرسالة.</p>
  </div>
</body>
</html>
